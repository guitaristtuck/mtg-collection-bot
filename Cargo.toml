[package]
name = "fb3k_discord_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = "0.4.38"
dotenv = "0.15.0"
futures = "0.3.30"
log = "0.4.21"
log4rs = "1.3.0"
reqwest = { version = "0.12.2", features = ["json"] }
serde = "1.0.197"
serde_json = "1.0.115"
serde_yaml = "0.9"
# `cache` (also in the defaults) is required: it supplies `old` to `voice_state_update`.
serenity = { version = "0.12", features = ["client", "gateway", "rustls_backend", "model", "collector", "cache"] }
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1.21.2", features = ["macros", "rt", "test-util"] }
wiremock = "0.6"
